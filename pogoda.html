<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погода внутри</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Cormorant+SC:wght@500&display=swap" rel="stylesheet">
<!--
  Погода внутри и энергия по дням. Данные — days.json:
  w: 1 паршиво · 2 так себе · 3 нормально · 4 хорошо · 5 ахуенно
  e: 0 на нуле · 1 мало · 2 норм · 3 через край
  Параметр ?m=2026-09 открывает конкретный месяц.
-->
<style>
  :root{ --bg:#191919; --ink:#ecdfc8; --muted:#9c907c; --faint:#3a342c; --gold:#e2b26e; --line:rgba(226,178,110,.38);
         --w1:#7f8b98; --w2:#9fb0c2; --w3:#8fb57f; --w4:#e2b26e; --w5:#f29a52; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;
    display:flex;flex-direction:column;padding:clamp(8px,2.4vw,20px) clamp(8px,2.6vw,22px)}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-weight:500;font-size:clamp(22px,min(8vw,10vh),44px);line-height:1}
  .sub{font-family:"Cormorant SC",Georgia,serif;letter-spacing:.12em;color:var(--gold);font-size:clamp(13px,min(3.6vw,5vh),19px)}
  nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:clamp(20px,5vw,28px);cursor:pointer;padding:2px 8px;border-radius:6px}
  nav button:hover,nav button:focus-visible{color:var(--gold);outline:none;background:rgba(226,178,110,.08)}
  nav button[disabled]{opacity:.25;cursor:default;background:none}
  .grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:clamp(2px,.6vw,6px);margin:clamp(8px,2vh,16px) 0 clamp(6px,1.4vh,12px);min-height:0}
  .dow{font-family:"Cormorant SC",Georgia,serif;letter-spacing:.1em;color:var(--muted);font-size:clamp(12px,3.6vw,17px);text-align:center;align-self:end}
  .day{position:relative;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding-top:clamp(4px,1.6vw,12px);container-type:size}
  .day .n{position:absolute;top:3px;left:5px;font-size:clamp(11px,3.2vw,16px);color:var(--muted);line-height:1}
  .day.has{background:radial-gradient(circle at 50% 58%,rgba(242,154,82,var(--glow,0)) 0%,rgba(242,154,82,0) 72%),rgba(255,255,255,.03)}
  .day.today{box-shadow:inset 0 0 0 1px var(--line)}
  .day.future .n{opacity:.35}
  .day svg.w{height:66%;width:auto;aspect-ratio:1;max-width:70%;max-height:56px}
  .day svg.f{display:none;width:min(44%,40px);height:auto;aspect-ratio:3/1;margin-top:clamp(3px,.8vh,6px)}
  @container (min-height:40px){ .day svg.w{height:52%} .day svg.f{display:block} }
  @container (max-height:34px){ .day .n{font-size:10px;top:1px;left:3px} }
  .dot{width:4px;height:4px;border-radius:50%;background:var(--faint)}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
  .line{font-style:italic;font-size:clamp(16px,min(4.6vw,6vh),26px)}
  .stat{font-size:clamp(13px,min(3.6vw,4.6vh),18px);color:var(--muted)}
  .tip{position:fixed;pointer-events:none;background:#0e0d0b;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:16px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
  @media (max-height:380px){ .sub,.line{display:none} h1{font-size:clamp(18px,6vw,26px)} .grid{margin:6px 0 4px} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1 id="title">…</h1><div class="sub">погода внутри · энергия</div></div>
  <nav><button id="prev" aria-label="Предыдущий месяц">‹</button><button id="next" aria-label="Следующий месяц">›</button></nav>
</header>
<div class="grid" id="grid"></div>
<footer><div class="line" id="line"></div><div class="stat" id="stat"></div></footer>
<div class="tip" id="tip"></div>
<script>
(function(){
  const W=[null,'паршиво','так себе','нормально','хорошо','ахуенно'];
  const E=['на нуле','мало','норм','через край'];
  const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const LINES=['Не прогноз и не диагноз. Просто какая была погода.','Пустые клетки — тоже дни. Просто без протокола.','Синоптики тоже ошибаются. Им можно, и тебе можно.'];
  const ns='http://www.w3.org/2000/svg';
  const glyph={
    1:'<path d="M14 26a7 7 0 0 1 1-13.9A9 9 0 0 1 32 14a6 6 0 0 1 0 12z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M15 31l-2 5M22 31l-2 5M29 31l-2 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    2:'<circle cx="27" cy="13" r="5.5" fill="none" stroke="currentColor" stroke-width="2" opacity=".7"/><path d="M11 32a7 7 0 0 1 1-13.9A9 9 0 0 1 29 20a6 6 0 0 1 0 12z" fill="var(--bg)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
    3:'<path d="M10 32C10 18 20 9 33 8c1 14-8 24-21 24z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 30C18 23 23 18 29 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    4:'<circle cx="20" cy="20" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 5v4M20 31v4M5 20h4M31 20h4M9.4 9.4l2.8 2.8M27.8 27.8l2.8 2.8M9.4 30.6l2.8-2.8M27.8 12.2l2.8-2.8"/></g>',
    5:'<path d="M20 4c1.6 8 4 10.4 12 12-8 1.6-10.4 4-12 12-1.6-8-4-10.4-12-12 8-1.6 10.4-4 12-12z" fill="currentColor" opacity=".9"/><path d="M31 25c.7 3.2 1.6 4.1 4.8 4.8-3.2.7-4.1 1.6-4.8 4.8-.7-3.2-1.6-4.1-4.8-4.8 3.2-.7 4.1-1.6 4.8-4.8z" fill="currentColor" opacity=".7"/>'
  };
  function flame(e){
    // энергия: три точки под значком; заполнено столько, сколько сил (на нуле — все пустые)
    let s='';
    for(let i=0;i<3;i++){const on=i<e; const c=e===3?'#f29a52':'#e2b26e';
      s+=`<circle cx="${5+i*10}" cy="5" r="${on?3:2.4}" fill="${on?c:'none'}" stroke="${on?c:'#6f6556'}" stroke-width="1.2"/>`}
    return `<svg class="f" viewBox="0 0 30 10" aria-hidden="true">${s}</svg>`;
  }
  const pad=n=>String(n).padStart(2,'0');
  const today=new Date(); const tKey=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  let cur, data={}, first=null;
  const qm=new URLSearchParams(location.search).get('m');
  cur = /^\d{4}-\d{2}$/.test(qm||'') ? new Date(+qm.slice(0,4), +qm.slice(5)-1, 1) : new Date(today.getFullYear(), today.getMonth(), 1);

  function render(){
    const y=cur.getFullYear(), m=cur.getMonth();
    document.getElementById('title').textContent=`${MONTHS[m]} ${y}`;
    const g=document.getElementById('grid'); g.innerHTML='';
    ['пн','вт','ср','чт','пт','сб','вс'].forEach(d=>{const el=document.createElement('div');el.className='dow';el.textContent=d;g.appendChild(el)});
    const off=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
    for(let i=0;i<off;i++) g.appendChild(document.createElement('div'));
    let rec=0,past=0; const cnt={};
    for(let d=1; d<=n; d++){
      const k=`${y}-${pad(m+1)}-${pad(d)}`, v=data[k], el=document.createElement('div');
      el.style.setProperty('--glow', v&&v.e!=null?[0,.12,.24,.4][v.e]:0); el.className='day'+(k===tKey?' today':'')+(k>tKey?' future':'')+(v?' has':'');
      el.innerHTML=`<span class="n">${d}</span>`;
      if(k<=tKey) past++;
      if(v){
        rec++; cnt[v.w]=(cnt[v.w]||0)+1;
        el.insertAdjacentHTML('beforeend',`<svg class="w" viewBox="0 0 40 40" style="color:var(--w${v.w})" aria-hidden="true">${glyph[v.w]}</svg>`+(v.e!=null?flame(v.e):''));
        const t=`${d} ${MG[m]} · ${W[v.w]}${v.e!=null?' · энергия: '+E[v.e]:''}`;
        el.setAttribute('aria-label',t); el.tabIndex=0; el.dataset.tip=t;
      } else if(k<=tKey){ el.insertAdjacentHTML('beforeend','<span class="dot"></span>'); }
      g.appendChild(el);
    }
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('stat').textContent = rec ? `записано ${rec} из ${past} · чаще всего ${W[top[0]]}` : 'в этом месяце пока тихо';
    document.getElementById('line').textContent=LINES[(y*12+m)%LINES.length];
    const firstM=first?new Date(+first.slice(0,4),+first.slice(5,7)-1,1):cur;
    document.getElementById('prev').disabled = cur<=firstM;
    document.getElementById('next').disabled = (y===today.getFullYear()&&m===today.getMonth());
  }
  document.getElementById('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
  document.getElementById('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
  const tip=document.getElementById('tip');
  function showTip(e){const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.dataset.tip;const r=t.getBoundingClientRect();
    tip.style.left=Math.min(innerWidth-tip.offsetWidth-6,Math.max(6,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=Math.max(4,r.top-tip.offsetHeight-6)+'px';tip.style.opacity=1}
  document.addEventListener('mouseover',showTip);document.addEventListener('focusin',showTip);document.addEventListener('mouseleave',()=>tip.style.opacity=0);
  fetch('days.json?t='+Date.now()).then(r=>r.json()).then(j=>{(j.days||[]).forEach(x=>data[x.d]=x);first=(j.days||[]).map(x=>x.d).sort()[0]||null}).catch(()=>{}).finally(render);
})();
</script>
</body>
</html>
