<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Счётчик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Cormorant+SC:wght@500&display=swap" rel="stylesheet">
<!--
  Встраивание в Notion: counter.html?c=perevody | stranicy | sdelano | igry | otpuscheno
  Цифры и подписи живут в counters.json — менять их там, страница подхватит сама.
-->
<style>
  :root{ --bg:#191919; --ink:#ecdfc8; --muted:#b8aa92; --gold:#e2b26e; --line:rgba(226,178,110,.55); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  .card{position:relative;width:100vw;height:100vh;border-radius:12px;overflow:hidden;
    background:var(--bg) center/cover no-repeat;color:var(--ink);
    font-family:"Cormorant Garamond",Georgia,serif}
  .card::before{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(10,9,7,.78) 0%,rgba(10,9,7,.5) 34%,rgba(10,9,7,0) 62%)}
  .txt{position:absolute;left:clamp(14px,5vw,64px);top:50%;transform:translateY(-50%);
    max-width:min(62vw,560px);display:flex;flex-direction:column;gap:clamp(4px,1.4vh,14px)}
  .num{font-weight:500;line-height:.9;letter-spacing:-.01em;font-size:clamp(40px,min(15vw,30vh),150px);
    font-variant-numeric:lining-nums;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  .label{font-family:"Cormorant SC",Georgia,serif;letter-spacing:.12em;font-size:clamp(13px,min(3.4vw,6.4vh),22px);color:var(--gold)}
  .rule{width:clamp(28px,5vw,56px);height:1px;background:var(--line);margin:clamp(2px,.8vh,8px) 0}
  .line{font-style:italic;font-size:clamp(17px,min(5vw,9vh),36px);line-height:1.2;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .stats{display:flex;flex-wrap:nowrap;align-items:flex-end;gap:clamp(6px,1.6vh,16px) clamp(12px,4vw,44px)}
  .stat{display:flex;flex-direction:column;gap:clamp(3px,1vh,10px)}
  .stat .num{font-size:clamp(24px,min(8.5vw,19vh),104px)}
  .num .approx{font-size:.45em;vertical-align:.55em;margin-right:.08em;opacity:.8}
  .multi .txt{max-width:min(86vw,720px)}
  .foot{font-size:clamp(12px,min(3vw,5.6vh),19px);color:var(--muted);margin-top:clamp(0px,1vh,10px)}
  .num,.txt>*{opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .6s ease}
  .ready .txt>*,.ready .num{opacity:1;transform:none}
  .ready .txt>*:nth-child(2){transition-delay:.08s}.ready .txt>*:nth-child(4){transition-delay:.16s}.ready .txt>*:nth-child(5){transition-delay:.24s}.ready .txt>*:nth-child(6){transition-delay:.3s}
  @media (prefers-reduced-motion:reduce){ .num,.txt>*{transition:none} }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="txt">
    <div class="num" id="num">…</div>
    <div class="label" id="label"></div>
    <div class="stats" id="stats" hidden></div>
    <div class="rule"></div>
    <div class="line" id="line"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
(function(){
  const key=(new URLSearchParams(location.search).get('c')||'perevody').replace(/[^a-z]/g,'');
  const card=document.getElementById('card');
  card.style.backgroundImage=`url(img/counters/${key}.webp?v=2)`;
  const MONTHS=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
  const now=new Date();
  const fmt=n=>Number(n).toLocaleString('ru-RU').replace(/ /g,' ');
  const fill=(s,d)=>(s||'').replace(/\{(\w+)\}/g,(_,k)=>k==='month'?MONTHS[now.getMonth()]:k==='year'?now.getFullYear():(d[k]==null?'…':typeof d[k]==='number'?fmt(d[k]):d[k]));
  fetch('counters.json?t='+Date.now()).then(r=>r.json()).then(all=>{
    const d=all[key]||{};
    if(Array.isArray(d.stats)){
      card.classList.add('multi');
      document.getElementById('num').remove(); document.getElementById('label').remove();
      const box=document.getElementById('stats'); box.hidden=false;
      d.stats.forEach(s=>{
        const el=document.createElement('div'); el.className='stat';
        el.innerHTML='<div class="num"></div><div class="label"></div>';
        const n=el.firstChild;
        if(s.approx){const a=document.createElement('span');a.className='approx';a.textContent='≈';n.appendChild(a)}
        const v=document.createElement('span'); n.appendChild(v);
        el.lastChild.textContent=fill(s.label,d);
        box.appendChild(el);
        if(s.value!=null) countUp(v,s.value); else v.textContent='…';
      });
    } else {
      if(d.value!=null) countUp(document.getElementById('num'),d.value);
      document.getElementById('label').textContent=fill(d.label,d);
    }
    document.getElementById('line').textContent=fill(d.line,d);
    const f=fill(d.foot,d); const fe=document.getElementById('foot'); fe.textContent=f; if(!f) fe.remove();
  }).catch(()=>{}).finally(()=>requestAnimationFrame(()=>card.classList.add('ready')));
  function countUp(el,target){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=fmt(target);return}
    const t0=performance.now(),dur=1100;
    (function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(target*e));if(p<1)requestAnimationFrame(step)})(t0);
  }
})();
</script>
</body>
</html>
