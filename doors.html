<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Двери</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500&display=swap" rel="stylesheet">
<script>
  /* ===== Двери: картинка, подпись при наведении, ссылка на страницу Notion ===== */
  window.DOORS = [
    { img: "img/nora.webp?v=4",         name: "Лисья нора",         href: "https://www.notion.so/3e6e894fbd4a816ca067cc1cb49b2ea6" },
    { img: "img/mediateka.webp?v=4",    name: "Каминная медиатека", href: "https://www.notion.so/3e7e894fbd4a81fcb5a1e166541f34c0" },
    { img: "img/igrovye-miry.webp?v=4", name: "Игровые миры",       href: "https://www.notion.so/3e8e894fbd4a81c196a6d9441230a654" },
    { img: "img/masterskaya.webp?v=4",  name: "Мастерская",         href: "https://www.notion.so/3e8e894fbd4a81d7960cdfbb5234bdde" },
    { img: "img/cherdak.webp?v=4",      name: "Чердак",             href: "https://www.notion.so/3e6e894fbd4a81458344cc9570a01608" }
  ];
</script>
<style>
  :root{ --bg:#191919; --ink:#ecdfc8; --gold:#e2b26e; --gap:clamp(8px,2.4vw,34px); --n:5; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);overflow:hidden;padding:8px 6px 0}
  /* арки подстраиваются под высоту рамки в Notion: потяни рамку — вырастут двери */
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--gap);height:100%}
  a{position:relative;display:block;text-decoration:none;outline:none;flex:none;
    height:min(calc(100vh - 38px), calc((100vw - 12px - (var(--n) - 1) * var(--gap)) / var(--n) * 1.5));aspect-ratio:2/3;
    border-radius:999px 999px 10px 10px}
  .arch{display:block;width:100%;height:100%;object-fit:cover;
    transition:transform .35s cubic-bezier(.2,.7,.2,1), filter .35s ease;filter:brightness(.9) saturate(.95)}
  .glow{position:absolute;inset:0;border-radius:999px 999px 10px 10px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(226,178,110,0);transition:box-shadow .35s ease, transform .35s cubic-bezier(.2,.7,.2,1)}
  .name{position:absolute;left:50%;top:100%;transform:translate(-50%,-4px);margin-top:8px;
    font-family:"Cormorant SC",Georgia,serif;letter-spacing:.18em;font-size:clamp(11px,1.5vw,15px);color:var(--gold);
    opacity:0;transition:opacity .3s ease, transform .3s ease;white-space:nowrap}
  a:hover .arch, a:focus-visible .arch{transform:translateY(-4px);filter:brightness(1.05) saturate(1.05)}
  a:hover .glow, a:focus-visible .glow{transform:translateY(-4px);box-shadow:0 14px 34px -10px rgba(226,178,110,.45)}
  a:hover .name, a:focus-visible .name{opacity:1;transform:translate(-50%,0)}
  a:focus-visible{outline:1px solid var(--gold);outline-offset:6px}
  @media (hover:none){ .name{opacity:.8;transform:translate(-50%,0)} }
  @media (prefers-reduced-motion: reduce){ .arch,.glow,.name{transition:none} }
</style>
</head>
<body>
<nav class="row" id="row" aria-label="Двери Лисьей обители"></nav>
<script>
  const row=document.getElementById('row');
  document.documentElement.style.setProperty('--n',(window.DOORS||[]).length||1);
  (window.DOORS||[]).forEach(d=>{
    const a=document.createElement('a'); a.href=d.href; a.target='_top'; a.setAttribute('aria-label',d.name); a.title=d.name;
    a.innerHTML=`<img class="arch" src="${d.img}" alt="" draggable="false"><span class="glow"></span><span class="name">${d.name}</span>`;
    row.appendChild(a);
  });
</script>
</body>
</html>
